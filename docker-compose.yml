services:
  kungfu-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kungfu_chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d kungfu_chess"]
      interval: 5s
      retries: 5

  chess-server:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      kungfu-postgres:
        condition: service_healthy

volumes:
  pgdata:
